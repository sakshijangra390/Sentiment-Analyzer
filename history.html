<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
{% extends 'layout.html' %}

{% block content %}

<h2>Prediction History</h2>

<table>

<tr>

<th>ID</th>

<th>Text</th>

<th>Sentiment</th>

<th>Date</th>

</tr>

{% for row in history %}

<tr>

<td>{{ row[0] }}</td>

<td>{{ row[1] }}</td>

<td>{{ row[2] }}</td>

<td>{{ row[3] }}</td>

</tr>

{% endfor %}

</table>

{% endblock %}
</body>
</html>
